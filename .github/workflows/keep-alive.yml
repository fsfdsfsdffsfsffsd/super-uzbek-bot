name: Keep Render bot awake

on:
  schedule:
    # Soat boshidagi GitHub navbatini chetlab, servisni har 5 daqiqada uyg'oq tutadi.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Avtoelon userbot
        env:
          BOT_URL: https://super-uzbek-bot-1.onrender.com/
        run: |
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --output /dev/null \
              --write-out "%{http_code}" --max-time 180 "$BOT_URL" || true)"
            case "$status" in
              2??|3??|4??)
                echo "Bot uyg'oq (HTTP $status)."
                exit 0
                ;;
            esac
            echo "Urinish $attempt muvaffaqiyatsiz (HTTP $status)."
            sleep 10
          done
          exit 1
